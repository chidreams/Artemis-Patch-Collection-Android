name: Sync, Format, and Release for Android

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync_android_patches]

permissions:
  contents: write # Required to push commits and create releases

jobs:
  sync-format-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pyyaml requests

      - name: Fetch import_patch.yml from Main Repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAIN_REPO="chidreams/Artemis-Patch-Collection-RPCS3"
          BRANCH="main"
          FILE_PATH="imported_patch.yml"
          
          URL="https://raw.githubusercontent.com/$MAIN_REPO/$BRANCH/$FILE_PATH"
          echo "Fetching from $URL"
          
          mkdir -p patches
          curl -H "Authorization: token $GITHUB_TOKEN" -L -o patches/imported_patch.yml "$URL"

      - name: Run Android Formatter Script
        run: python scripts/format_android.py

      - name: Commit and Push Changes if Updated
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add patches/imported_patch.yml
          
          if git diff --staged --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes to sync."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            git commit -m "Auto-sync and format import_patch.yml for Android (ARMSX3)"
            git push
          fi

      - name: Create Dynamic Release Tag
        if: steps.git-check.outputs.changes == 'true'
        id: tag
        run: |
          TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Publish GitHub Release with Patch File
        if: steps.git-check.outputs.changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: "Android Patch Collection Update (${{ steps.tag.outputs.tag_name }})"
          body: "Automatically synced and formatted `imported_patch.yml` for Android / ARMSX3 users."
          files: patches/imported_patch.yml
